keys:
  - commit
trigger:
  tag: commit
  type: cmd
  expect: string
  action: |
    echo "Your commit:"
    echo "git commit -m '{commit_message}'"
actions:
  - tag: changed_files
    type: cmd
    match: '.+'
    expect: list<string>
    action: 'git diff --name-only'
  - tag: file_diffs
    type: cmd
    expect: string
    action: 'git diff --stat {changed_files}'
  - tag: file_summaries
    type: llm
    expect: string
    action: |
      For each file below, describe the changes in one line:
      {file_diffs}
  - tag: commit_message
    type: llm
    expect: string
    action: |
      Write a single conventional commit message summarizing ALL changes below.
      Choose the best type: feat (new feature), fix (bug fix), docs (documentation),
      refactor (code restructuring), test (testing), chore (maintenance).
      Examples:
        feat: add user authentication
        fix: resolve memory leak in parser
        docs: update API documentation
      Reply with ONE message:
      {file_summaries}
