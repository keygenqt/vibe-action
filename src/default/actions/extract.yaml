name: extract
about: Extract structured data or matching lines from text and logs
check: null
clipboard: false
args:
  - name: file
    short: 'f'
    expect: string
    help: Path to the log or text file
    default: null
  - name: query
    short: 'q'
    expect: string
    help: Extraction criteria (e.g., 'find all errors')
    default: null
actions:
  - tag: tag_lines
    type: cmd
    expect: list<string>
    check: null
    confirm: false
    action: cat {file}
  - tag: tag_content
    type: llm
    expect: string
    check: null
    confirm: false
    action: |-
      [Task]
      Read the log line and the search query.
      If the line matches the query — output the EXACT line unchanged.
      If the line does not match — output only a single dash: "-"
      Do NOT skip lines. Process every line.

      [Query]
      {query}

      [Line]
      {tag_lines}
  - tag: tag_clean
    type: value
    expect: string
    check: null
    confirm: false
    action: '{tag_content|trim:-}'
  - tag: tag_extract
    type: value
    expect: string
    check: null
    confirm: false
    action: '{tag_clean|join:uniq}'
