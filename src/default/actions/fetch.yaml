name: fetch
about: Fetch a web page or PDF and describe its content
clipboard: true
notify: true
args:
  - name: source
    short: s
    input: string
    help: Path or URL of the page to fetch
  - name: to
    short: 'l'
    input: string
    help: Language for explanation
    default: Russian
actions:
  - tag: tag_description
    run: small
    expect: string
    action: |
      [Task]
      Write a summary strictly in {to} language based on the document content below.

      Requirements:
      1. Length: 2-5 sentences maximum.
      2. Focus: Explain the purpose, type, and core content.
      3. Details: Extract essential tools, key features, and specifics mentioned in the text.
      4. Language: {to}

      [Content]
      {source|load|text}
