version: 0.0.2

name: sysinfo
about: Generate a human-readable system report

api:
  output: dialog

actions:
  # Generate system report
  - tag: tag_report
    run: small
    reg: '.+'
    val:
      - name: lang
        data: system_language
      - name: os
        data: system_os
      - name: arch
        data: system_arch
      - name: hostname
        data: system_hostname
      - name: shell
        data: system_shell
      - name: user
        data: system_user
      - name: date
        data: system_date
      - name: time
        data: system_time
      - name: pid
        data: system_pid
      - name: home
        data: system_dir_home
      - name: pwd
        data: system_dir_pwd
    action: |
      [Task]
      Generate a short system report using the data below.
      Format as bullet points. Language: {lang}.

      [Data]
      OS: {os}
      Architecture: {arch}
      Hostname: {hostname}
      Shell: {shell}
      System Language: {lang}
      User: {user}
      Date: {date}
      Time: {time}
      Process ID: {pid}
      Home: {home}
      Working directory: {pwd}
