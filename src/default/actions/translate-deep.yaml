name: translate-deep
about: Deep two-stage translation using local drafting and cloud polishing
notify: true
args:
  - name: text
    short: 't'
    input: string
    default: '{system_clipboard}'
    help: Text to translate
  - name: file
    short: 'f'
    input: string
    default: ''
    help: File or URL to translate
  - name: to
    short: 'l'
    input: string
    help: Target language (e.g., Russian, English, Chinese)
    default: 'Russian'
# IDE plugin integration: maps argument names to IDE contexts
api:
  # Target for the final result (replace | clipboard | dialog)
  output: dialog
  # Maps argument for JSON output (selection | clipboard)
  args:
    text: selection
actions:
  # Read input from file or text argument
  - tag: tag_content
    run: cmd
    expect: string
    check: .+
    action:
      - when: '{file|empty}'
        then: echo "{text}"
      - when: '{file|empty:not}'
        then: cat "{file|load}"
  # Local model generates a raw text translation
  - tag: tag_draft
    run: small
    expect: string
    action: |
      [Task]
      Translate the entire [Text] to the language specified in [User].
      Do not translate proper names, code, or comments inside code blocks.
      Reply with the full raw translated text.

      [User]
      {to}

      [Text]
      {tag_content}
  # Powerful cloud model polishes and refines the draft without original context
  - tag: tag_translated
    run: medium
    expect: string
    action: |
      [Task]
      Act as an expert native editor and senior technical writer.
      Review, polish, and fix the IT slang and phrasing in this rough draft translated into the language specified in [User].
      Keep formatting, code blocks, and proper names intact. Output ONLY the polished final text.

      [User]
      {to}

      [Rough Draft]
      {tag_draft}
  # Copy result to clipboard and output
  - tag: tag_clipboard
    run: value
    expect: string
    action: '{tag_draft|clipboard}'
