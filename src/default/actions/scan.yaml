version: 0.0.2

name: scan
about: Scan project codebase and export as structured JSON
notify: true

api:
  output: dialog
  input: query_project_path

actions:
  # Validate path is a directory and resolve to absolute
  - tag: tag_resolve
    run: value
    reg: '.+'
    val:
      - name: path
        data: query_project_path
        mods: 'resolve:dir'
        fail: 'is:empty:not'
    action: '{path}'

  # Scan, parse AST, and format as JSON array
  - tag: tag_json
    run: value
    val:
      - name: json
        data: tag_resolve
        mods: 'scan|ast|format:json'
    action: '{json}'

  # Save to file with timestamp
  - tag: tag_save
    run: cmd
    reg: '.+'
    val:
      - name: json
        data: tag_json
      - name: dir
        data: system_dir_download
      - name: pid
        data: system_pid
    action: |
      printf '%s' {json} > {dir}/vibe-export-{pid}.json
      printf 'Saved to %s/vibe-export-%s.json\n' {dir} {pid}
