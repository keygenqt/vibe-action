[package]
name = "vibe-action"
version = "0.0.7"
edition = "2024"
license = "Apache-2.0"
description = "Command router — execute shell commands and LLM prompts via simple YAML actions."
repository = "https://gitcode.com/keygenqt_vz/vibe-action"
documentation = "https://vibe-action.keygenqt.com"
authors = ["Vitaliy Zarubin <keygenqt@yandex.ru>"]
keywords = ["cli", "llm", "pipeline", "automation"]
readme = "README.md"

[dependencies]
# CLI
clap = { version = "4.6", features = ["derive", "string"] }
clap-cargo = "0.18"
colored = "3.1"
inquire = "0.9.4"

# Async runtime
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"

# Http client
reqwest = { version = "0.13", features = ["json"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
yaml_serde = "0.10"

# Utilities
dirs = "6"
anyhow = "1"
chrono = "0.4"
regex = "1.10"
dunce = "1"
walkdir = "2.5"
url = "2.5"
arboard = "3.6"
shell-words = "1.1"
notify-rust = "4"
tiktoken-rs = "0.12"
termimad = "0.34"
syntect = "5.3"
image = "0.25"
base64 = "0.22"
html2text = "0.17"
pdf-extract = "0.12"
tempfile = "3.27"
mime2ext = "0.1.54"

# Debug logging (--debug flag)
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Vibe
vibe-cluster = "0.0.5"
vibe-ast = "0.0.12"
