[package]
name = "vibe-action"
version = "0.0.1"
edition = "2024"
license = "Apache-2.0"
description = "AI-native command router — execute shell commands and LLM prompts via simple YAML actions"
repository = "https://gitcode.com/keygenqt_vz/vibe-action"
authors = ["Vitaliy Zarubin <keygenqt@yandex.ru>"]
readme = "README.md"

[dependencies]
# CLI
clap = { version = "4.6", features = ["derive", "string"] }
clap-cargo = "0.18"
colored = "3.1"
inquire = "0.9.4"

# Async runtime
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
yaml_serde = "0.10"

# Utilities
dirs = "6"
anyhow = "1"
chrono = "0.4"
regex = "1.10"
dunce = "1"
walkdir = "2.5"
url = "2.5"
arboard = "3.6"
shell-words = "1.1"

# Debug logging (--debug flag)
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# AI
vibe-cluster = "0.0.4"
