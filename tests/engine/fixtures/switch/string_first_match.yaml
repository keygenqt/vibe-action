version: 0.0.1
name: string-first-match
about: Test switch where first case matches → second skipped
actions:
  - tag: tag_check
    run: value
    expect: string
    action: DIRTY

  - tag: tag_result
    run: value
    expect: string
    action:
      - when: '{tag_check|contains:DIRTY}'
        then: first
      - when: '{tag_check|contains:DIRTY}'
        then: second
