version: 0.0.1
name: list-all-false
about: Test switch where no list elements match case → error
actions:
  - tag: tag_items
    run: cmd
    expect: list
    action: |
      echo "cherry"
      echo "fig"
      echo "elderberry"

  - tag: tag_result
    run: value
    expect: string
    action:
      - when: '{tag_items|contains:a}'
        then: '{tag_items|upper}'
