name: list-all-false
about: Test switch where no list elements match case → error
args: []
actions:
  - tag: tag_items
    run: cmd
    expect: list<string>
    action: |
      echo "cherry"
      echo "fig"
      echo "elderberry"

  - tag: tag_result
    run: value
    expect: string
    action:
      - when: '{tag_items|contains:a}'
        then: '{tag_items|upper}'
