name: list-all-true
about: Test switch where all list elements match case
actions:
  - tag: tag_items
    run: cmd
    expect: list
    action: |
      echo "apple"
      echo "banana"
      echo "apricot"

  - tag: tag_result
    run: value
    expect: string
    action:
      - when: '{tag_items|contains:a}'
        then: '{tag_items|upper}'
