name: list-mixed
about: Test switch where some list elements match case, some don't
args: []
actions:
  - tag: tag_items
    run: cmd
    expect: list<string>
    action: |
      echo "apple"
      echo "banana"
      echo "cherry"

  - tag: tag_result
    run: value
    expect: string
    action:
      - when: '{tag_items|contains:a}'
        then: '{tag_items|upper}'
