name: list-is-file-all-false
about: Test switch with is_file where no files exist → error
args: []
actions:
  - tag: tag_files
    run: cmd
    expect: list<string>
    action: |
      echo "nonexistent1.txt"
      echo "nonexistent2.txt"

  - tag: tag_result
    run: value
    expect: string
    action:
      - when: '{tag_files|resolve|is_file}'
        then: '{tag_files}'
