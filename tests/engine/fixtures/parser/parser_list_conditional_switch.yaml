name: parser-list-conditional-switch
about: Test list expansion and conditional logic switch branches
actions:
  - tag: tag_files
    run: cmd
    expect: list
    action: |
      echo "index.ts"
      echo "main.rs"
  - tag: tag_result
    run: value
    expect: string
    action:
      - when: '{tag_files|contains:rs}'
        then: 'Found Rust source: {tag_files|upper}'
