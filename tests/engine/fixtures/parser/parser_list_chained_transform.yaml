version: 0.0.1
name: parser-list-chained-transform
about: Test multi-stage sequential modifiers applied across lists
actions:
  - tag: tag_items
    run: cmd
    expect: list
    action: |
      echo "  orange  "
      echo "  grape   "
  - tag: tag_result
    run: value
    expect: string
    action: "{tag_items|trim|upper|join:,\\s}"
