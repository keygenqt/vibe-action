name: chain-hardcore
about: Extreme stress-test for multi-stage sequential modifiers and types ping-pong
clipboard: false
notify: false
actions:
  - tag: tag_input
    run: cmd
    expect: list<string>
    action: |
      echo " orange "
      echo " grape "
      echo " orange "
  - tag: tag_result
    run: value
    expect: string
    action: "{tag_input|trim|upper|join|split|reverse|join:uniq:,\\s}"
